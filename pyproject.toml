[project]
name = "tender_crm"
authors = [
    { name = "Thiru", email = "thiru@tendersoftware.com"}
]
description = "TSI's customization layer over the Frappe CRM (crm) app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0"  # Installed and managed by bench.
    # "crm"             # Declared in hooks.py as required_apps; bench installs it.
    # "erpnext"         # Optional at import time - see tender_crm/crm_overrides/README.md.
    #
    # Nothing else: this app imports only `frappe`, `crm` and (guarded) `erpnext`.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
